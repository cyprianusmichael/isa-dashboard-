<style>
/* Layout: control bar, KPI strip, daily chart, location ledger, roster detail; one column on phones */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#e9ebe6; --line:#d9dcd4; --ink:#1b211d; --mute:#5f675f;
  --real:#24508f; --plan:#b9c3d0; --plan-ink:#6d7a8c;
  --good:#1f7a4d; --good-bg:#e2f1e8; --bad:#b42318; --bad-bg:#fbe4e1; --warn:#9a6700; --warn-bg:#fdf1d6;
  --focus:#24508f;
  --f-display:"Archivo",ui-sans-serif,"Segoe UI",Arial,sans-serif;
  --f-body:"Figtree",ui-sans-serif,"Segoe UI",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --sunk:#232a26; --line:#2f3832; --ink:#e7ebe6; --mute:#9aa49b;
  --real:#7fa6e6; --plan:#3c4757; --plan-ink:#8d9ab0;
  --good:#5cc08b; --good-bg:#16301f; --bad:#f2836f; --bad-bg:#3a1d18; --warn:#e2b34f; --warn-bg:#352a12;
  --focus:#7fa6e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --sunk:#232a26; --line:#2f3832; --ink:#e7ebe6; --mute:#9aa49b;
  --real:#7fa6e6; --plan:#3c4757; --plan-ink:#8d9ab0;
  --good:#5cc08b; --good-bg:#16301f; --bad:#f2836f; --bad-bg:#3a1d18; --warn:#e2b34f; --warn-bg:#352a12;
  --focus:#7fa6e6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top .sub{margin-top:4px;color:var(--mute);font-size:14px}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--plan-ink);display:inline-block}
.dot.live{background:var(--good)} .dot.err{background:var(--bad)} .dot.busy{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.5;cursor:default}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:14px}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn);display:flex;gap:8px}
.note.err{background:var(--bad-bg);color:var(--bad)}
.note.info{background:var(--sunk);color:var(--mute)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:13px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--sunk);color:var(--mute)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
select{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px}
.scroll{overflow-x:auto}
svg text{font-family:var(--f-num);fill:var(--mute)}
.chart{min-width:640px}

/* table */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.grp td{background:var(--sunk);font-weight:600;font-size:13px}
tr.loc{cursor:pointer}
tr.loc:hover td{background:var(--sunk)}
tr.loc[aria-selected="true"] td{background:var(--sunk)}
tr.loc[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--real)}
tr.tot td{font-weight:600;border-bottom:0}
.loccell{display:flex;gap:8px;align-items:baseline}
.loccell b{font-family:var(--f-display);font-weight:600}
.meter{display:inline-block;width:72px;height:6px;background:var(--sunk);border-radius:3px;position:relative;vertical-align:middle;margin-left:8px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--real);border-radius:3px}
.meter i.over{background:var(--bad)}
.pos{color:var(--bad)} .neg{color:var(--good)}

/* detail */
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.mini .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:9px;gap:2px}
.strip span{height:9px;border-radius:2px;background:var(--sunk)}
.strip span.H{background:var(--real)}
.strip span.A{background:var(--bad)}
.strip span.pH{background:var(--plan)}
.strip span.pA{background:transparent;box-shadow:inset 0 0 0 1px var(--plan-ink)}
.strip span.cut{opacity:.35}
.roster td{vertical-align:middle}
.roster .who{display:grid;text-align:left;white-space:normal;min-width:170px}
.roster .who small{color:var(--mute);font-size:12px}
.pair{display:grid;gap:3px}
.tag{font-size:11px;color:var(--mute);margin-left:6px}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
footer{font-size:12px;color:var(--mute)}

<script>
// Shared parser: Sheets get_spreadsheet payload (effectiveValue grid) -> compact model
const LOKASI = ['BSP','BGM','MGM','KPM','KGM','KGC','HO','DC','CPU','CK'];
const OUTLET = ['BSP','BGM','MGM','KPM','KGM','KGC'];
function ev(c){ const e=c&&c.effectiveValue; if(!e) return null; if('numberValue' in e) return e.numberValue; if('stringValue' in e) return e.stringValue; if('boolValue' in e) return e.boolValue; return null; }
function parseFile(payload){
  const out={lok:{}, omzet:null, days:0};
  for(const sh of (payload.sheets||[])){
    const t=sh.properties&&sh.properties.title; const blk=(sh.data||[])[0]||{};
    const rows=(blk.rowData||[]).map(r=>(r.values||[]).map(ev));
    const r0=blk.startRow||0;
    if(t==='REKAP'){ out.omzet=parseOmzet(rows); continue; }
    if(LOKASI.indexOf(t)<0) continue;
    let h=-1; for(let i=0;i<Math.min(rows.length,12);i++){ if(rows[i].some(v=>typeof v==='string'&&/^nama karyawan$/i.test(v.trim()))){h=i;break;} }
    if(h<0) continue;
    const hdr=rows[h]; const col={day:{}};
    hdr.forEach((v,c)=>{ if(typeof v==='string'){ const s=v.trim().toLowerCase();
        if(s==='nama karyawan') col.nama=c; else if(s==='jabatan') col.jab=c; else if(s==='area') col.area=c; else if(s.indexOf('gaji harian')===0) col.rate=c; }
      else if(typeof v==='number' && v>=1 && v<=31 && Number.isInteger(v) && col.day[v]==null && c>(col.rate||0)) col.day[v]=c; });
    const nd=Object.keys(col.day).length; out.days=Math.max(out.days,nd);
    const emps=[];
    for(let i=h+1;i<rows.length;i++){
      const r=rows[i]; const a=r[0];
      if(typeof a==='string' && /^(jumlah|total)/i.test(a.trim())) break;
      if(i===h+1 && typeof r[col.day[1]]==='string' && /^(mon|tue|wed|thu|fri|sat|sun|sen|sel|rab|kam|jum|sab|min)/i.test(r[col.day[1]])) continue;
      const nama=String(r[col.nama]==null?'':r[col.nama]).trim();
      let s=''; for(let d=1;d<=nd;d++){ const v=String(r[col.day[d]]==null?'':r[col.day[d]]).trim().toUpperCase(); s+= v==='H'?'H':(v==='A'?'A':'-'); }
      if(!nama && s.indexOf('H')<0) continue;
      const rate=typeof r[col.rate]==='number'?r[col.rate]:0;
      emps.push([nama, String(r[col.jab]||'').trim(), col.area!=null?String(r[col.area]||'').trim().toUpperCase():'', Math.round(rate*100)/100, s]);
    }
    out.lok[t]=emps;
  }
  return out;
}
function parseOmzet(rows){
  const o={};
  rows.forEach(r=>{ const a=typeof r[0]==='string'?r[0].trim():''; if(OUTLET.indexOf(a)<0||o[a]) return;
    const v=r.slice(1,32).map(x=>typeof x==='number'?x:null); if(v.some(x=>x!=null)) o[a]=v; });
  return Object.keys(o).length?o:null;
}
if(typeof module!=='undefined') module.exports={parseFile,LOKASI,OUTLET};

</script>

    const map=new Map(); const keyOf=(x,i,seen)=>{ if(x[0]) return x[0].toUpperCase(); const j=x[1]||"TANPA NAMA"; seen[j]=(seen[j]||0)+1; return "~"+j+"#"+seen[j]; };
    let s1={}; bE.forEach((x,i)=>{ const kk=keyOf(x,i,s1); map.set(kk,{nama:x[0],jab:x[1],area:x[2],rate:x[3],bs:x[4],rs:null}); });
    let s2={}; rE.forEach((x,i)=>{ const kk=keyOf(x,i,s2); const e=map.get(kk); if(e){ e.rs=x[4]; e.rate=x[3]||e.rate; if(!e.nama) e.nama=x[0]; } else map.set(kk,{nama:x[0],jab:x[1],area:x[2],rate:x[3],bs:null,rs:x[4]}); });
    o.emps=[...map.values()];
    loc[L]=o;
  }
  return { k, N, cut, loc, hasR: cut>0 };
}
const sum = (a,from,to) => { let s=0; for(let i=from;i<to;i++) s+=a[i]||0; return s; };
function agg(c, locs){
  const o={b:new Array(c.N).fill(0), r:new Array(c.N).fill(0), bMd:new Array(c.N).fill(0), rMd:new Array(c.N).fill(0)};
  for(const L of locs){ const x=c.loc[L]; for(let d=0;d<c.N;d++){ o.b[d]+=x.b[d]; o.r[d]+=x.r[d]; o.bMd[d]+=x.bMd[d]; o.rMd[d]+=x.rMd[d]; } }
  return o;
}
function omzetTo(x,cut){ if(!x.omzet) return null; let s=0,n=0; for(let d=0;d<cut;d++){ const v=x.omzet[d]; if(typeof v==="number"){ s+=v; n++; } } return n?{s,n}:null; }
function scopeLocs(s){ if(s==="ALL") return LOKASI; if(s==="OUT") return OUTLET; if(s==="BO") return GROUPS[1][1]; return [s]; }

/* ---------- render ---------- */
function render(){
  const k=state.sel; const c=calc(k);
  renderMonths();
  $("sub").textContent = c ? (c.hasR ? `${monLabel(k)} · realisasi tercatat s.d. tanggal ${c.cut} dari ${c.N}` : `${monLabel(k)} · realisasi belum diisi`) : monLabel(k);
  renderNotes(c);
  if(!c){ $("kpis").innerHTML=""; $("chart").innerHTML='<div class="empty">File budget bulan ini belum tersedia.</div>'; $("tbl").innerHTML=""; $("detail").innerHTML=""; return; }
  renderKpis(c); renderScope(c); renderChart(c); renderTable(c); renderDetail(c);
  $("foot").textContent = "Sumber: file " + k + "_BUDGET dan " + k + "_REALISASI Absensi Gaji Harian di Google Drive. Biaya = gaji harian × hari berstatus H. Gaji/omzet memakai omzet dari tab REKAP file realisasi; batas 25% mengikuti penanda merah di sheet.";
}

function renderMonths(){
  const keys=Object.keys(state.months).sort();
  $("months").innerHTML = keys.map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===state.sel}">${monLabel(k)}</button>`).join("");
  $("months").querySelectorAll("button").forEach(b=>b.onclick=()=>{ state.sel=b.dataset.k; state.loc=null; render(); if(state.live && state.months[state.sel].src!=="live") loadMonth(state.sel); });
}

function renderNotes(c){
  const notes=[]; const m=state.months[state.sel];
  if(m.err) notes.push(["err", m.err]);
  if(c && !c.hasR) notes.push(["info", "Belum ada absensi realisasi untuk bulan ini. Angka budget tetap ditampilkan; perbandingan muncul setelah outlet mulai mengisi."]);
  if(c && m.r && m.r.omzet){
    const seen={}; for(const [L,v] of Object.entries(m.r.omzet)){ const sig=JSON.stringify(v); if(v.filter(x=>x).length>2){ if(seen[sig]) notes.push(["warn", `Omzet ${seen[sig]} dan ${L} di tab REKAP realisasi persis sama. Kemungkinan rumus IMPORTRANGE salah satu outlet masih menunjuk file outlet lain.`]); else seen[sig]=L; } }
  }
  if(c && c.hasR){ const miss=OUTLET.filter(L=>!omzetTo(c.loc[L],c.cut)); if(miss.length) notes.push(["info", `Omzet belum terbaca untuk ${miss.join(", ")}. Rasio gaji/omzet lokasi tersebut tidak dihitung (cek "Allow access" pada IMPORTRANGE di tab REKAP).`]); }
  $("notes").innerHTML = notes.map(([t,s])=>`<div class="note ${t==="warn"?"":t}">${esc(s)}</div>`).join("");
}

function varChip(diff, base){
  if(!base) return '<span class="chip neutral">—</span>';
  const p=diff/base; if(Math.abs(p)<0.005) return '<span class="chip neutral">Sesuai budget</span>';
  return diff>0 ? `<span class="chip bad">Lebih ${pct(p)}</span>` : `<span class="chip good">Hemat ${pct(-p)}</span>`;
}

function renderKpis(c){
  const a=agg(c,LOKASI); const cut=c.cut, N=c.N;
  const bFull=sum(a.b,0,N), bTo=sum(a.b,0,cut), rTo=sum(a.r,0,cut);
  const proj=rTo+sum(a.b,cut,N);
  const rMd=sum(a.rMd,0,cut), bMd=sum(a.bMd,0,cut);
  let oS=0,oG=0,oN=0; for(const L of OUTLET){ const om=omzetTo(c.loc[L],cut); if(om){ oS+=om.s; oG+=sum(c.loc[L].r,0,cut); oN++; } }
  const tiles=[];
  if(c.hasR){
    tiles.push(["Realisasi s.d. tgl "+cut, rpShort(rTo), `${fmtInt.format(rMd)} hari-orang hadir`]);
    tiles.push(["Selisih vs budget s.d. tgl "+cut, rpShort(rTo-bTo), `${varChip(rTo-bTo,bTo)} <span>budget ${rpShort(bTo)}</span>`]);
    tiles.push(["Perkiraan total "+BULAN[+c.k.slice(2)-1], rpShort(proj), cut<N ? `${varChip(proj-bFull,bFull)} <span>realisasi + budget sisa ${N-cut} hari</span>` : `${varChip(proj-bFull,bFull)} <span>budget ${rpShort(bFull)}</span>`]);
    tiles.push(["Gaji outlet / omzet", oN? pct(oG/oS) : "—", oN ? `${oG/oS>TARGET_RASIO?'<span class="chip bad">Di atas 25%</span>':'<span class="chip good">Di bawah 25%</span>'} <span>${oN} outlet, omzet ${rpShort(oS)}</span>` : "Omzet belum tersedia"]);
  } else {
    tiles.push(["Budget bulan ini", rpShort(bFull), `${fmtInt.format(sum(a.bMd,0,N))} hari-orang direncanakan`]);
    tiles.push(["Budget outlet", rpShort(sum(agg(c,OUTLET).b,0,N)), "6 outlet"]);
    tiles.push(["Budget back office", rpShort(sum(agg(c,GROUPS[1][1]).b,0,N)), "HO, DC, CPU, CK"]);
    tiles.push(["Rata-rata per hari", rpShort(bFull/N), `${N} hari kalender`]);
  }
  $("kpis").innerHTML = tiles.map(([l,v,d])=>`<div class="kpi"><div class="eyebrow">${esc(l)}</div><div class="v" title="${esc(v)}">${v}</div><div class="d">${d}</div></div>`).join("");
}

function renderScope(c){
  const opts=[["ALL","Semua lokasi"],["OUT","Semua outlet"],["BO","Back office"]].concat(LOKASI.map(L=>[L,NAMA[L]]));
  if(!opts.some(o=>o[0]===state.scope)) state.scope="ALL";
  $("scope").innerHTML=opts.map(([v,t])=>`<option value="${v}"${v===state.scope?" selected":""}>${esc(t)}</option>`).join("");
}
$("scope").onchange=e=>{ state.scope=e.target.value; if(LOKASI.includes(state.scope)) state.loc=state.scope; render(); };

function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function renderChart(c){
  const a=agg(c,scopeLocs(state.scope)); const N=c.N, cut=c.cut;
  $("chartTitle").textContent = "Biaya gaji harian per tanggal" + (state.scope==="ALL"?"":" · "+$("scope").selectedOptions[0].text);
  const W=960,H=260,ml=58,mr=12,mt=12,mb=34; const iw=W-ml-mr, ih=H-mt-mb;
  const max=niceMax(Math.max(...a.b,...a.r)); const y=v=>mt+ih-(v/max)*ih; const bw=iw/N;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik biaya gaji harian budget dan realisasi per tanggal">`;
  for(let i=0;i<=4;i++){ const v=max*i/4, yy=y(v); g+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="11">${v===0?"0":(v/1e6).toLocaleString("id-ID",{maximumFractionDigits:1})+" jt"}</text>`; }
  for(let d=0;d<N;d++){
    const x=ml+d*bw, sun=dow(c.k,d+1)===0;
    const bh=ih-(y(a.b[d])-mt); g+=`<rect x="${x+bw*0.12}" y="${y(a.b[d])}" width="${bw*0.76}" height="${Math.max(0,bh)}" rx="2" fill="var(--plan)" opacity="${d<cut||!c.hasR?1:.55}"><title>${d+1} ${monLabel(c.k)} · Budget ${rp(a.b[d])} (${a.bMd[d]} orang)${d<cut?" · Realisasi "+rp(a.r[d])+" ("+a.rMd[d]+" orang)":""}</title></rect>`;
    if(d<cut){ const rh=ih-(y(a.r[d])-mt); g+=`<rect x="${x+bw*0.3}" y="${y(a.r[d])}" width="${bw*0.4}" height="${Math.max(0,rh)}" rx="1.5" fill="var(--real)" pointer-events="none"/>`; }
    g+=`<text x="${x+bw/2}" y="${H-mb+15}" text-anchor="middle" font-size="10"${sun?' style="fill:var(--bad)"':""}>${d+1}</text>`;
  }
  if(c.hasR && cut<N){ const xc=ml+cut*bw; g+=`<line x1="${xc}" x2="${xc}" y1="${mt}" y2="${mt+ih}" stroke="var(--mute)" stroke-dasharray="3 3"/><text x="${xc+6}" y="${mt+12}" font-size="11">tercatat s.d. tgl ${cut}</text>`; }
  g+=`<text x="${ml}" y="${H-4}" font-size="10">Tanggal (merah = Minggu)</text></svg>`;
  $("chart").innerHTML=g;
}

function renderTable(c){
  const cut=c.hasR?c.cut:c.N;
  $("tblHint").textContent = c.hasR ? `Perbandingan s.d. tanggal ${cut}. Klik lokasi untuk melihat rincian karyawan.` : `Budget sebulan penuh. Klik lokasi untuk melihat rincian karyawan.`;
  let h=`<thead><tr><th>Lokasi</th><th>Hari-orang<br>budget / hadir</th><th>Budget</th><th>Realisasi</th><th>Selisih</th><th>Gaji / omzet</th></tr></thead><tbody>`;
  const tot={b:0,r:0,bm:0,rm:0};
  for(const [gn,locs] of GROUPS){
    const sub={b:0,r:0,bm:0,rm:0};
    h+=`<tr class="grp"><td colspan="6">${gn}</td></tr>`;
    for(const L of locs){
      const x=c.loc[L]; const b=sum(x.b,0,cut), r=c.hasR?sum(x.r,0,cut):0, bm=sum(x.bMd,0,cut), rm=c.hasR?sum(x.rMd,0,cut):0;
      sub.b+=b; sub.r+=r; sub.bm+=bm; sub.rm+=rm;
      const ratio=b? r/b:0; const om=c.hasR?omzetTo(x,cut):null; const lr=om? sum(x.r,0,cut)/om.s : null;
      h+=`<tr class="loc" tabindex="0" data-l="${L}" aria-selected="${L===state.loc}"><td><span class="loccell"><b>${L}</b><span class="mute" style="font-size:13px">${esc(NAMA[L].replace(L,"").trim())}</span></span></td>
        <td class="num">${fmtInt.format(bm)} / ${c.hasR?fmtInt.format(rm):"—"}</td>
        <td class="num">${rp(b)}</td>
        <td class="num">${c.hasR?rp(r)+`<span class="meter" aria-hidden="true"><i class="${ratio>1?"over":""}" style="width:${Math.min(100,ratio*100)}%"></i></span>`:"—"}</td>
        <td class="num ${r-b>0?"pos":"neg"}">${c.hasR?(r-b>0?"+":"")+fmtInt.format(Math.round(r-b)):"—"}</td>
        <td>${lr==null?'<span class="mute">—</span>':`<span class="chip ${lr>TARGET_RASIO?"bad":"good"}">${pct(lr)}</span>`}</td></tr>`;
    }
    for(const k in sub) tot[k]+=sub[k];
    h+=`<tr class="tot"><td>Subtotal ${gn.toLowerCase()}</td><td class="num">${fmtInt.format(sub.bm)} / ${c.hasR?fmtInt.format(sub.rm):"—"}</td><td class="num">${rp(sub.b)}</td><td class="num">${c.hasR?rp(sub.r):"—"}</td><td class="num ${sub.r-sub.b>0?"pos":"neg"}">${c.hasR?(sub.r-sub.b>0?"+":"")+fmtInt.format(Math.round(sub.r-sub.b)):"—"}</td><td></td></tr>`;
  }
  h+=`<tr class="tot"><td>Total semua lokasi</td><td class="num">${fmtInt.format(tot.bm)} / ${c.hasR?fmtInt.format(tot.rm):"—"}</td><td class="num">${rp(tot.b)}</td><td class="num">${c.hasR?rp(tot.r):"—"}</td><td class="num ${tot.r-tot.b>0?"pos":"neg"}">${c.hasR?(tot.r-tot.b>0?"+":"")+fmtInt.format(Math.round(tot.r-tot.b)):"—"}</td><td></td></tr></tbody>`;
  $("tbl").innerHTML=h;
  $("tbl").querySelectorAll("tr.loc").forEach(tr=>{ const go=()=>{ state.loc=tr.dataset.l; state.scope=tr.dataset.l; render(); $("detail").scrollIntoView({behavior:"smooth",block:"start"}); }; tr.onclick=go; tr.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }; });
}

function renderDetail(c){
  const L = state.loc || (()=>{ // default: location with largest overspend, else BSP
    if(!c.hasR) return "BSP"; let best="BSP",bv=-Infinity; for(const l of LOKASI){ const x=c.loc[l]; const v=sum(x.r,0,c.cut)-sum(x.b,0,c.cut); if(v>bv){bv=v;best=l;} } return best; })();
  const x=c.loc[L]; const cut=c.hasR?c.cut:c.N; const N=c.N;
  let h=`<div class="ph"><div><div class="eyebrow">Rincian lokasi</div><h2>${esc(NAMA[L])}</h2></div>
    <div class="legend"><span><span class="sw" style="background:var(--plan)"></span>Rencana masuk</span><span><span class="sw" style="box-shadow:inset 0 0 0 1px var(--plan-ink)"></span>Rencana libur</span><span><span class="sw" style="background:var(--real)"></span>Hadir (H)</span><span><span class="sw" style="background:var(--bad)"></span>Tidak hadir (A)</span></div></div>`;
  // area mini cards
  const areas=Object.entries(x.area).filter(([a])=>a!=="-");
  const om=c.hasR?omzetTo(x,cut):null;
  h+=`<div class="detail-grid">`;
  h+=`<div class="mini"><span class="eyebrow">Budget s.d. tgl ${cut}</span><span class="v">${rp(sum(x.b,0,cut))}</span><span class="mute" style="font-size:12px">sebulan ${rp(sum(x.b,0,N))}</span></div>`;
  h+=`<div class="mini"><span class="eyebrow">Realisasi s.d. tgl ${cut}</span><span class="v">${c.hasR?rp(sum(x.r,0,cut)):"—"}</span><span style="font-size:12px">${c.hasR?varChip(sum(x.r,0,cut)-sum(x.b,0,cut),sum(x.b,0,cut)):'<span class="mute">belum diisi</span>'}</span></div>`;
  for(const [a,v] of areas) h+=`<div class="mini"><span class="eyebrow">Area ${esc(a)}</span><span class="v">${c.hasR?rp(v.r):rp(v.b)}</span><span style="font-size:12px">${c.hasR?varChip(v.r-v.b,v.b)+' <span class="mute">budget '+rpShort(v.b)+'</span>':'<span class="mute">budget</span>'}</span></div>`;
  if(om) h+=`<div class="mini"><span class="eyebrow">Gaji / omzet</span><span class="v">${pct(sum(x.r,0,cut)/om.s)}</span><span class="mute" style="font-size:12px">omzet ${rpShort(om.s)} (${om.n} hari)</span></div>`;
  h+=`</div>`;
  // roster
  const rows=x.emps.map(e=>{ const bd=e.bs?[...e.bs.slice(0,cut)].filter(s=>s==="H").length:0; const rd=e.rs?[...e.rs.slice(0,cut)].filter(s=>s==="H").length:0; const ra=e.rs?[...e.rs.slice(0,cut)].filter(s=>s==="A").length:0; return {...e,bd,rd,ra}; });
  if(c.hasR) rows.sort((p,q)=>(q.rd-q.bd)*q.rate-(p.rd-p.bd)*p.rate);
  h+=`<div class="scroll"><table class="roster"><thead><tr><th>Karyawan</th><th>Gaji harian</th><th>Hari budget</th><th>Hari hadir</th><th>Selisih biaya</th><th style="text-align:left">Absensi tgl 1–${N} <span style="text-transform:none;letter-spacing:0">(atas: rencana · bawah: realisasi)</span></th></tr></thead><tbody>`;
  for(const e of rows){
    const strip=(s,kind)=>{ let o=`<div class="strip" style="grid-template-columns:repeat(${N},9px)">`; for(let d=0;d<N;d++){ const v=s?s[d]:"-"; const cls = kind==="p" ? (v==="H"?"pH":(v==="A"?"pA":"")) : (v==="H"?"H":(v==="A"?"A":"")); o+=`<span class="${cls}${d>=cut&&kind==="r"?" cut":""}" title="${d+1} ${HARI[dow(c.k,d+1)]}: ${v==="-"?"kosong":v}"></span>`; } return o+"</div>"; };
    const diff=(e.rd-e.bd)*e.rate;
    const nm = e.nama || ("Tanpa nama · "+(e.jab||"casual"));
    const tag = !e.bs ? '<span class="chip warn">tidak ada di budget</span>' : (!e.rs ? '<span class="chip neutral">tidak ada di realisasi</span>' : "");
    h+=`<tr><td><div class="who"><span>${esc(nm)} ${tag}</span><small>${esc(e.jab||"")}${e.area?" · "+esc(e.area):""}</small></div></td>
      <td class="num">${fmtInt.format(Math.round(e.rate))}</td><td class="num">${e.bs?e.bd:"—"}</td>
      <td class="num">${c.hasR?(e.rs?e.rd+(e.ra?` <span class="mute">(${e.ra}A)</span>`:""):"—"):"—"}</td>
      <td class="num ${diff>0?"pos":(diff<0?"neg":"")}">${c.hasR?(diff>0?"+":"")+fmtInt.format(Math.round(diff)):"—"}</td>
      <td style="text-align:left"><div class="pair">${strip(e.bs,"p")}${strip(e.rs,"r")}</div></td></tr>`;
  }
  if(!rows.length) h+=`<tr><td colspan="6" class="empty">Belum ada karyawan di tab ini.</td></tr>`;
  h+=`</tbody></table></div>`;
  $("detail").innerHTML=h;
}

/* ---------- live data ---------- */
let mcp=null;
function setStatus(kind,text){ $("dot").className="dot "+(kind||""); $("statusText").textContent=text; }
function hhmm(t){ const d=new Date(t); return d.toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
function errText(e){
  const s=e&&e.server?e.server:"konektor Google";
  switch(e&&e.code){
    case "needs_reauth": return `Sambungan ${s} kedaluwarsa. Sambungkan ulang di Pengaturan claude.ai → Connectors, lalu tekan "Ambil data terbaru".`;
    case "server_not_connected": case "server_not_found": return `${s} belum tersambung untuk akun ini. Tambahkan di Pengaturan claude.ai → Connectors.`;
    case "selection_required": return `Ada lebih dari satu konektor ${s}. Pilih salah satu saat diminta, lalu muat ulang.`;
    case "not_in_manifest": case "consent_required": return `Akses ${s} untuk halaman ini belum diizinkan. Menampilkan data tersimpan.`;
    case "blocked_by_policy": case "approval_required": return `Akses ${s} dibatasi kebijakan organisasi. Menampilkan data tersimpan.`;
    case "tool_error": return `${s} menolak permintaan: ${e.message||"file tidak bisa dibaca"}.`;
    case "not_granted": case "capability_disabled": case "capability_removed": return null;
    default: return `${s} tidak merespons saat ini. Coba lagi beberapa saat lagi.`;
  }
}
async function call(server,tool,input,refresh){
  try { return (await mcp.callTool(server,tool,input,{cache:{staleTime:refresh?0:120000,refresh:!!refresh}})).payload; }
  catch(e){ if(e&&e.retryable){ await new Promise(r=>setTimeout(r,(e.retryAfterMs||1500)+Math.random()*800)); return (await mcp.callTool(server,tool,input,{cache:{staleTime:0,refresh:true}})).payload; } throw e; }
}
async function listMonths(refresh){
  const p=await call("Google Drive","search_files",{query:`parentId = '${FOLDER}' and (title contains '_BUDGET' or title contains '_REALISASI')`,pageSize:100,excludeContentSnippets:true},refresh);
  for(const f of (p&&p.files)||[]){ const m=/^(\d{4})_(BUDGET|REALISASI)/.exec(f.title||""); if(!m) continue; const k=m[1]; const mo=state.months[k]||(state.months[k]={b:null,r:null,ids:{},src:"none"}); mo.ids[m[2]==="BUDGET"?"b":"r"]=f.id; }
}
async function loadMonth(k,refresh){
  const m=state.months[k]; if(!m||!mcp) return;
  if(!m.ids.b && !m.ids.r){ return; }
  setStatus("busy","Mengambil data "+monLabel(k)+"…"); $("refresh").disabled=true;
  try{
    const [pb,pr]=await Promise.all([
      m.ids.b?call("Google Sheets","get_spreadsheet",{spreadsheetId:m.ids.b,includeGridData:true,ranges:RANGES_B,fields:FIELDS},refresh):null,
      m.ids.r?call("Google Sheets","get_spreadsheet",{spreadsheetId:m.ids.r,includeGridData:true,ranges:RANGES_R,fields:FIELDS},refresh):null]);
    if(pb) m.b=parseFile(pb); if(pr) m.r=parseFile(pr);
    m.src="live"; m.err=null; state.fetchedAt[k]=Date.now(); state.live=true;
    setStatus("live","Langsung dari Google Sheets · "+hhmm(state.fetchedAt[k]));
  }catch(e){
    const t=errText(e);
    if(t){ m.err=t; setStatus("err","Gagal memperbarui · menampilkan "+(m.src==="snap"?"data tersimpan "+SNAP.at:"data sebelumnya")); }
  }finally{ $("refresh").disabled=false; if(k===state.sel) render(); }
}
$("refresh").onclick=async()=>{
  if(!mcp){ setStatus("err","Data langsung tidak tersedia di tampilan ini · data tersimpan "+SNAP.at); return; }
  try{ await listMonths(true); }catch(e){ const t=errText(e); if(t){ state.months[state.sel].err=t; render(); } }
  await loadMonth(state.sel,true);
};

/* ---------- boot ---------- */
(function boot(){
  const keys=Object.keys(state.months).sort();
  // default: most recent month with realisasi data, else latest
  state.sel = keys.slice().reverse().find(k=>{ const c=calc(k); return c&&c.hasR; }) || keys[keys.length-1];
  setStatus("","Data tersimpan "+SNAP.at);
  render();
  if(window.claude && window.claude.use){
    window.claude.use("mcp").then(async m=>{
      if(!m) return; mcp=m;
      try{ await listMonths(false); render(); }catch(e){ const t=errText(e); if(t){ state.months[state.sel].err=t; setStatus("err","Gagal memperbarui · data tersimpan "+SNAP.at); render(); } return; }
      await loadMonth(state.sel,false);
    });
  }
})();
</script>
